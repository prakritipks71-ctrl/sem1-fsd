<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    //self is default value of target attribute. It opens the link in the same tab or window.
    <br>
    <a href="https://www.google.com" target="_self">self</a>
    <a href="https://www.google.com" target="_parent">parent</a>
    <a href="https://www.google.com" target="_top">top</a>
    <a href="https://www.google.com" target="_blank">blank</a>
    <hr>
    <iframe src="https://flipkart.com" height="300" width="250"></iframe>
    <iframe src="https://amazon.com" height="300" width="250"></iframe>
    <br>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/tg2MwT5FPdY?si=Xigglu9_stTlfd6A" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
</body>
</html>
