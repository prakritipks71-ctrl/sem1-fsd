<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/DAY-05/register.html" method="get">
        <label for="name">enter your name:</label>
        <input type="text" placeholder="name" id="name" name="name" value="abc" minlength="2" maxlength="50">
        <br>
        <br>
        <label for="age">enter your age:</label>
        <input type="number" placeholder="age" id="age" name="age" required min="0" max="100">   
        <br>
        <br>
        <label for="email">enter your email:</label>
        <input type="email" placeholder="email" id="email" name="email" value="abc@gmail.com">
        <br>
        <br>
        <label for="password">enter your password:</label>
        <input type="password" placeholder="password" id="password" name="password">
        <br>
        <br>
        <label for="gender">select your gender:</label>
        <select name="gender" id="gender">
            <option value="male">male</option>
            <option value="female">female</option>
            <option value="other">other</option>
        </select>
        <br>
        <br>
        <label for="color">choose color:</label>
        <input type="color" name="color" id="color">
        <br>
        <br>
        <label for="date">choose dob:</label>
        <input type="date" name="date" id="date">
        <br>
        <br>
        <input type="submit" value="submit your form">
        <br>
        <br>
        

        <button type="submit">submit</button>
        <button type="reset">reset</button>
        


    </form>
    
</body>
</html>
